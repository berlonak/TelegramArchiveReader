# Optional temporary local reverse proxy before obtaining the IP certificate.
# Do NOT serve personal history publicly over plaintext HTTP.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}
