name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q tests
      - run: bash -n deploy/install-bundle.sh && bash -n deploy/configure-https-ip.sh
      - name: Parse PowerShell scripts (PowerShell 7)
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Filter *.ps1) {
            $t = $null; $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e)
            foreach ($x in $e) { $bad++; Write-Output "$($f.Name):$($x.Extent.StartLineNumber) $($x.Message)" }
          }
          exit $bad

  windows-scripts:
    # Runs the .bat/.ps1 safe branches with real cmd.exe and Windows PowerShell 5.1.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q tests/test_windows_runtime.py tests/test_windows_scripts.py tests/test_messages.py
